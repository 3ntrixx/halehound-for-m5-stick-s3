[platformio]
src_dir = .

[env:m5stick-s3]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Native USB-Serial/JTAG, same esptool-stub caveat as the T-Embed/Cardputer
; ADV's own S3 boards — see those envs' comments above.
upload_flags = --no-stub

build_src_filter =
    -<*>
    +<board_bringup_m5stick_s3.cpp>
    +<board_m5stick_s3.h>
    +<board_power_m5stick_s3.cpp>
    +<board_power_m5stick_s3.h>
    +<flock_you_tembed.cpp>
    +<flock_you_tembed.h>
    +<wardrive_lite.cpp>
    +<wardrive_lite.h>
    +<karma_attack_tembed.cpp>
    +<karma_attack_tembed.h>
    +<saved_captures_tembed.cpp>
    +<saved_captures_tembed.h>
    +<iot_recon_tembed.cpp>
    +<iot_recon_tembed.h>
    +<loot_viewer_tembed.cpp>
    +<loot_viewer_tembed.h>
    +<button_input.cpp>
    +<button_input.h>
    +<cyd_config.h>
    +<spi_manager.cpp>
    +<spi_manager.h>
    +<messaging.cpp>
    +<messaging.h>
    +<settings_manager.cpp>
    +<settings_manager.h>
    +<battery_gauge.cpp>
    +<battery_gauge.h>
    +<psram_pool.cpp>
    +<psram_pool.h>
    +<radio_manager.cpp>
    +<radio_manager.h>
    +<i2c_manager.cpp>
    +<i2c_manager.h>
    +<input_task.cpp>
    +<input_task.h>
    +<ui_render.cpp>
    +<ui_render.h>
    +<menu_data.h>
    +<wifi_scan.cpp>
    +<wifi_scan.h>
    +<packet_monitor.cpp>
    +<packet_monitor.h>
    +<ble_scan.cpp>
    +<ble_scan.h>
    +<ble_skeletonkey.cpp>
    +<ble_skeletonkey.h>
    +<ble_spoofer.cpp>
    +<ble_spoofer.h>
    +<ble_beacon.cpp>
    +<ble_beacon.h>
    +<lunatic_fringe.cpp>
    +<lunatic_fringe.h>
    +<airtag_tracker.cpp>
    +<airtag_tracker.h>
    +<ble_database.h>
    +<storage_manager.cpp>
    +<storage_manager.h>
    +<eapol_sniff.cpp>
    +<eapol_sniff.h>
    +<deauther.cpp>
    +<deauther.h>
    +<wifi_guardian.cpp>
    +<wifi_guardian.h>
    +<probe_sniffer.cpp>
    +<probe_sniffer.h>
    +<beacon_spammer.cpp>
    +<beacon_spammer.h>
    +<auth_flood.cpp>
    +<auth_flood.h>
    +<station_scan.cpp>
    +<station_scan.h>
    +<oui_registry.cpp>
    +<oui_registry.h>
    +<captive_portal.cpp>
    +<captive_portal.h>
    +<portal_pages.h>

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_M5STICK_S3=1
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSER_SETUP_LOADED
    -include User_Setup_M5StickS3.h
    ; deauther.cpp's ieee80211_raw_frame_sanity_check() override, same
    ; reason every other WiFi-raw-TX env carries this flag.
    -Wl,--allow-multiple-definition

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    kosme/arduinoFFT@^2.0.2
    M5PM1=https://github.com/m5stack/M5PM1.git#1.0.7

; 8MB flash, 8MB octal PSRAM (memory_type qio_opi) per the outline's board
; bring-up section — NOT measured against a linked firmware yet (outline
; §2: "budget application space... after measuring the linked firmware").
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB

monitor_filters = esp32_exception_decoder
